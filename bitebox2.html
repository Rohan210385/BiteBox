    <style>
        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: "Merriweather", serif;
        }


        body {
            width: 100%;
            min-height: 100vh;
            background-color: #f5f5f5;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
        }


        nav {
            width: 100%;
            min-height: 80px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 5px 30px;

            background-color: black;
        }


        /* Logo */

        nav #logo {
            display: flex;
            align-items: center;

            gap: 10px;

            color: white;
        }


        nav #logo img {
            width: 65px;
            height: 65px;

            border-radius: 50%;

            object-fit: cover;
        }


        nav #logo h3 {
            font-size: 22px;
        }


        /* Menu */

        nav #menu ul {
            display: flex;
            align-items: center;

            gap: 25px;

            list-style-type: none;
        }


        nav #menu ul a {
            text-decoration: none;

            color: white;

            font-size: 16px;
        }


        nav #menu ul a:hover {
            color: orange;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;

            min-height: calc(100vh - 150px);

            padding: 25px;
        }


        .main_content {
            width: 100%;
        }


        .main_content h2 {
            text-align: center;

            margin-bottom: 25px;

            font-size: 28px;
        }


        /* =========================
           PRODUCT CONTAINER
        ========================= */

        #product_container {
            width: 100%;

            display: grid;

            grid-template-columns: repeat(4, 250px);

            justify-content: center;

            gap: 25px;

            padding: 10px;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .card {
            width: 250px;

            border: 2px solid black;

            border-radius: 8px;

            padding: 5px;

            background-color: white;

            display: flex;

            flex-direction: column;

            gap: 10px;

            transition: transform 0.5s;
        }


        .card:hover {
            transform: translateY(-5px) scale(1.02);
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product_logo {
            width: 100%;

            height: 200px;

            border: 2px solid lightgray;

            border-radius: 5px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .product_logo img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        /* =========================
           PRODUCT DETAILS
        ========================= */

        .product_detail {
            display: flex;

            flex-direction: column;

            gap: 10px;

            text-align: center;

            padding: 10px;
        }


        .product_detail p {
            margin: 0;
        }


        .product_detail p:first-child {
            font-size: 20px;

            font-weight: bold;
        }


        .product_detail p:nth-child(2) {
            font-size: 18px;

            font-weight: bold;

            color: red;
        }


        /* =========================
           BUTTON
        ========================= */

        .product_detail button {
            padding: 10px;

            border: none;

            cursor: pointer;

            border-radius: 5px;

            background-color: black;

            color: white;

            font-size: 15px;
        }


        .product_detail button:hover {
            background-color: orange;

            color: black;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            width: 100%;

            min-height: 70px;

            border-top: 2px solid black;

            display: flex;

            align-items: center;

            justify-content: center;

            background-color: black;

            color: white;
        }


        .footer_content p {
            text-align: center;
        }

    display: flex;

#search button {

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1150px) {

            #product_container {
                grid-template-columns: repeat(3, 250px);
            }

        }


        @media (max-width: 850px) {

            #product_container {
                grid-template-columns: repeat(2, 250px);
            }


            nav {
                flex-direction: column;

                gap: 10px;

                padding: 10px;
            }

        }


        @media (max-width: 600px) {

            #product_container {
                grid-template-columns: 250px;
            }


            nav #menu ul {
                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            main {
                padding: 15px;
            }

        }
