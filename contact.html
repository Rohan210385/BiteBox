
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BiteBox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
        }

        nav {
            background-color: black;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: red;
        }

        .hero {
            background-color: #e31b23;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .contact-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .contact-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        .contact-box h2 {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-submit {
            background-color: #e31b23;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
        }

        .btn-submit:hover {
            background-color: black;
            color: white;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                padding: 0;
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>BiteBox</h2>

        <ul>
            <li><a href="bitebox.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Contact Us</h1>
        <p>We would love to hear from you!</p>
    </section>

    <main class="contact-container">

        <div class="contact-box">
            <h2>Send Us a Message</h2>

            <form id="contactForm">

                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           placeholder="Enter your name"
                           required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input type="text"
                           class="form-control"
                           id="subject"
                           placeholder="Enter subject"
                           required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control"
                              id="message"
                              rows="5"
                              placeholder="Write your message"
                              required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    Submit Message
                </button>

            </form>

            <div id="successMessage"
                 class="alert alert-success mt-3"
                 style="display: none;">
                Your form has been validated successfully!
                Note: This demo does not send your message.
            </div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 BiteBox Ecommerce Portal. All rights reserved.</p>
    </footer>

    <script>
        const contactForm = document.getElementById("contactForm");

        contactForm.addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("successMessage").style.display = "block";

            contactForm.reset();
        });
    </script>

</body>
</html>
